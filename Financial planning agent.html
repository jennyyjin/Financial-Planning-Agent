    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }

<body>
  <div id="__bundler_placeholder">Loading Budget planner...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

F, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Geist';\n  font-style: normal;\n  font-weight: 400 700;\n  font-display: swap;\n  src: url(\"118e3082-3fda-47d7-a4ab-d8ef67a5436b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/instrumentserif/v5/jizHRFtNs2ka5fXjeivQ4LroWlx-6zAjgn7Motmp5r61.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/instrumentserif/v5/jizHRFtNs2ka5fXjeivQ4LroWlx-6zAjjH7Motmp5g.woff2) format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/instrumentserif/v5/jizBRFtNs2ka5fXjeivQ4LroWlx-6zsTjnTLgNuZ5w.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"430c55a5-6343-42af-8685-71cd61670c81\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#E6E5E1;color:#000000;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#000000}a:hover{color:#B4480B}\n*{box-sizing:border-box}\nbutton,textarea{font:inherit;color:inherit}\n:focus-visible{outline:3px solid #FF7A1A;outline-offset:3px}\n.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}\n.num{font-variant-numeric:tabular-nums;letter-spacing:-0.045em;font-weight:600;line-height:.9}\n.faint{opacity:.38}\n\n/* bento grid */\n.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}\n.t{border-radius:22px;padding:28px;min-width:0;position:relative}\n.s12{grid-column:span 12}.s8{grid-column:span 8}.s4{grid-column:span 4}.s3{grid-column:span 3}\n@media (max-width:1000px){.s3{grid-column:span 6}.s4,.s8{grid-column:span 12}}\n@media (max-width:640px){.s3,.s4,.s8{grid-column:span 12}.t{padding:22px}.hero-title{font-size:48px!important}}\n\n/* intro + input card: one tile that folds into a slim note */\n.intro{overflow:hidden;max-height:420px;opacity:1;margin:0 0 12px;transition:max-height .6s cubic-bezier(.7,0,.2,1),opacity .3s ease,margin .6s cubic-bezier(.7,0,.2,1)}\n.intro.is-gone{max-height:0;opacity:0;margin:0}\n.card{background:#FFFFFF;overflow:hidden;border-radius:22px;transition:max-width .65s cubic-bezier(.7,0,.2,1),padding .65s cubic-bezier(.7,0,.2,1),border-radius .65s cubic-bezier(.7,0,.2,1)}\n.card.is-open{max-width:1200px;padding:20px 24px}\n.card.is-closed{max-width:720px;padding:10px 10px 10px 24px;border-radius:999px}\n.open-body{max-height:760px;opacity:1;transition:max-height .6s cubic-bezier(.7,0,.2,1),opacity .2s ease}\n.is-closed .open-body{max-height:0;opacity:0}\n.closed-body{max-height:0;opacity:0;transition:max-height .35s ease,opacity .3s ease}\n.is-closed .closed-body{max-height:96px;opacity:1;transition:max-height .4s ease .4s,opacity .35s ease .45s}\ntextarea{width:100%;height:clamp(110px,calc(100vh - 560px),300px);resize:vertical;border:0;border-radius:14px;padding:22px 24px;font-size:20px;line-height:1.55;background:#F2F1EE;transition:background .2s,box-shadow .2s}\ntextarea:focus{outline:none;background:#FFFFFF;box-shadow:inset 0 0 0 2px #000000}\ntextarea::placeholder{color:#6B6A66}\n.primary{min-height:52px;padding:0 26px;border:0;border-radius:999px;background:#000000;color:#FFFFFF;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s,transform .2s}\n.primary:hover{background:#FF7A1A;color:#000000}\n.primary:active{transform:scale(.97)}\n.primary:disabled{background:#BDBCB7;color:#FFFFFF;cursor:not-allowed}\n.ghost{min-height:44px;padding:0 18px;border:1.5px solid #000000;border-radius:999px;background:transparent;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s,color .2s}\n.ghost:hover{background:#000000;color:#FFFFFF}\n\n/* working moment: a squiggly ring that draws itself */\n.status{display:flex;flex-direction:column;align-items:center;gap:18px;margin:64px auto 0;animation:rise .4s ease both}\n.squig{width:132px;height:132px;animation:spin 3s linear infinite}\n.squig path{fill:none;stroke:#000000;stroke-width:5;stroke-linecap:round;stroke-dasharray:820;animation:draw 1.5s cubic-bezier(.6,0,.3,1) both}\n@keyframes draw{from{stroke-dashoffset:820}to{stroke-dashoffset:0}}\n@keyframes spin{to{transform:rotate(360deg)}}\n@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}\n.reveal{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}\n.r1{animation-delay:.05s}.r2{animation-delay:.15s}.r3{animation-delay:.25s}.r4{animation-delay:.35s}.r5{animation-delay:.45s}.r6{animation-delay:.55s}.r7{animation-delay:.65s}\n\n/* pies */\n.pie{width:210px;height:210px;transform:rotate(-90deg);display:block;margin:20px auto 24px}\n.slice{fill:none;stroke-width:100}\n.wipe{fill:none;stroke-width:102;stroke-dasharray:314.16 314.16;animation:wipe 1s cubic-bezier(.6,0,.25,1) both}\n.w1{animation-delay:.55s}.w2{animation-delay:.75s}.w3{animation-delay:.95s}\n@keyframes wipe{from{stroke-dashoffset:0}to{stroke-dashoffset:-314.16}}\n\n/* comparison bars: ghost = as it stands, solid = this budget */\n.track{position:relative;height:6px;border-radius:6px;background:transparent;margin-top:8px;width:100%}\n.track .g{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#DEDDD8}\n.track .f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.7,.2,1) .9s both}\n@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n\n/* changed amounts + rationale */\n.chg{position:relative;display:inline-flex;align-items:baseline;gap:8px;min-height:40px;padding:8px 12px;border:0;border-radius:999px;cursor:help;font-variant-numeric:tabular-nums}\n.chg .amt{font-weight:600;text-decoration:underline dotted 1.5px;text-underline-offset:4px}\n.chg .delta{font-size:14px;font-weight:600}\n.is-cut{background:#FFE3CF}.is-cut .delta{color:#A3400A}\n.is-up{background:#DCE8FB}.is-up .delta{color:#1A4DB0}\n.is-moved{background:#ECEBE7}.is-moved .delta{color:#45443F}\n.tip{position:absolute;z-index:5;bottom:calc(100% + 10px);left:50%;width:300px;padding:14px 16px;border-radius:14px;background:#000000;color:#FFFFFF;font-size:15px;font-weight:400;line-height:1.5;text-align:left;opacity:0;pointer-events:none;transform:translate(-50%,6px);transition:opacity .18s ease,transform .18s ease}\n.tip.end{left:auto;right:0;transform:translate(0,6px)}\n.chg:hover .tip,.chg:focus .tip,.chg:focus-visible .tip{opacity:1;transform:translate(-50%,0)}\n.chg:hover .tip.end,.chg:focus .tip.end,.chg:focus-visible .tip.end{transform:translate(0,0)}\n\n@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}.wipe{display:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; padding: 16px 16px 20px\" data-canvas-width=\"1440\" data-canvas-height=\"3000\" data-document-role=\"page\" data-label=\"Budget planner\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n\n<header style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 4px 8px 12px\">\n<span style=\"display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600\">\n<svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#000000\"><\u002Fcircle><path d=\"M12 2a10 10 0 0 1 10 10H12z\" fill=\"#FF7A1A\"><\u002Fpath><\u002Fsvg>\nBudget planner<\u002Fspan>\n<span style=\"font-size: 14px; color: #55544F\">Monthly figures, in today’s dollars<\u002Fspan>\n<\u002Fheader>\n\n<div class=\"{{introClass}}\">\n<div class=\"grid\">\n<div class=\"t s8\" style=\"background: #CDEBF7; display: flex; flex-direction: column; justify-content: space-between; gap: 18px\">\n<h1 class=\"serif hero-title\" style=\"margin: 0; font-size: clamp(44px, 7.5vh, 84px); line-height: .95; letter-spacing: -0.02em\">Tell us where your money stands.<\u002Fh1>\n<p style=\"margin: 0; max-width: 48ch; font-size: 18px; line-height: 1.55; color: #1E2A30\">Write it the way you’d explain it to a friend: what comes in, what goes out, and what you’re saving for. We’ll turn it into three budgets you can compare.<\u002Fp>\n<\u002Fdiv>\n<div class=\"t s4\" style=\"background: #FF7A1A; display: flex; flex-direction: column; justify-content: space-between; gap: 16px\">\n<span style=\"font-size: 15px; font-weight: 600\">What you’ll get<\u002Fspan>\n<div style=\"display: flex; align-items: flex-end; gap: 14px\">\n<span class=\"num\" style=\"font-size: clamp(72px, 12vh, 140px)\">3<\u002Fspan>\n<span style=\"font-size: 18px; line-height: 1.3; font-weight: 500; padding-bottom: 12px\">budgets, side by side, with a reason for every change<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"{{cardClass}}\">\n<div class=\"open-body\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<label for=\"situation\" style=\"font-size: 15px; font-weight: 600\">Your situation<\u002Flabel>\n<textarea id=\"situation\" value=\"{{text}}\" sc-camel-on-change=\"{{onText}}\" sc-camel-on-input=\"{{onText}}\" placeholder=\"I take home about $5,000 a month after tax. Rent is $1,650…\"><\u002Ftextarea>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px\">\n<p style=\"margin: 0; max-width: 46ch; font-size: 15px; line-height: 1.5; color: #55544F\">Include take-home pay, regular bills, debts and any goals with a date. Rough numbers are fine.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<button type=\"button\" class=\"ghost\" sc-camel-on-click=\"{{useExample}}\">Fill in an example<\u002Fbutton>\n<button type=\"button\" class=\"primary\" sc-camel-on-click=\"{{submit}}\">Build my budgets<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{showHint}}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"margin: 0; font-size: 15px; font-weight: 600; color: #A3400A\">Add a few details about your money first, or click Fill in an example.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"closed-body\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div style=\"flex: 1 1 auto; min-width: 0\">\n<div style=\"font-size: 13px; font-weight: 600; color: #55544F\">Your situation<\u002Fdiv>\n<div style=\"font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{snippet}}<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" class=\"ghost\" sc-camel-on-click=\"{{edit}}\" style=\"flex: none\">Edit<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{isWorking}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"status\" role=\"status\">\n<svg class=\"squig\" sc-camel-view-box=\"0 0 140 140\" aria-hidden=\"true\"><path d=\"{{squiggle}}\" sc-camel-path-length=\"820\"><\u002Fpath><\u002Fsvg>\n<p class=\"serif\" style=\"margin: 0; font-size: 30px\">Working out your three budgets<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{showResults}}\" hint-placeholder-val=\"{{ true }}\">\n<main class=\"grid\" style=\"margin-top: 12px; margin-bottom: 60px\">\n\n<section class=\"t s8 reveal r1\" style=\"background: #000000; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 36px; min-height: 380px\">\n<span style=\"font-size: 15px; font-weight: 600; color: #BDBCB7\">Your plan<\u002Fspan>\n<div>\n<h2 class=\"serif\" style=\"margin: 0; font-size: 72px; line-height: .98; letter-spacing: -0.015em; max-width: 13ch\">Both of your goals are within reach.<\u002Fh2>\n<p style=\"margin: 22px 0 0; max-width: 58ch; font-size: 18px; line-height: 1.6; color: #D9D8D3\">Your essentials take 49% of your take-home pay, which is right where they should be. The pressure is on your goals: at today’s pace the Japan trip comes up $1,900 short and the moving deposit hasn’t started. We recommend the goals-first budget. It asks for about $600 less on wants each month, and in return both goals land on time.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"t s4 reveal r2\" style=\"background: #FF7A1A; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; min-height: 380px\">\n<span style=\"font-size: 15px; font-weight: 600\">Saved each month, goals first<\u002Fspan>\n<div>\n<div class=\"num\" style=\"font-size: 132px\">29<span class=\"faint\">%<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 16px 0 0; font-size: 17px; line-height: 1.45; font-weight: 500\">Up from 11% today. That’s $1,450 a month instead of $550.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"s12 reveal r3\" style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; padding: 44px 8px 8px\">\n<h2 class=\"serif\" style=\"margin: 0; font-size: 48px; line-height: 1; letter-spacing: -0.01em\">Three ways to budget $5,000 a month<\u002Fh2>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 18px; font-size: 15px\">\n<li style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 14px; height: 14px; border-radius: 50%; background: #000000\"><\u002Fspan>Needs<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 14px; height: 14px; border-radius: 50%; background: #FF7A1A\"><\u002Fspan>Wants<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 14px; height: 14px; border-radius: 50%; background: #2D6CDF\"><\u002Fspan>Savings<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 14px; height: 14px; border-radius: 50%; background: #B9B8B2\"><\u002Fspan>Not assigned<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<sc-for list=\"{{budgets}}\" as=\"b\" hint-placeholder-count=\"3\">\n<article class=\"t s4 reveal {{b.rv}}\" style=\"background: {{b.bg}}; display: flex; flex-direction: column\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 30px\">\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em\">{{b.name}}<\u002Fh3>\n<sc-if value=\"{{b.recommended}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding: 6px 12px; border-radius: 999px; background: #000000; color: #FFFFFF; font-size: 13px; font-weight: 600\">Recommended<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #3F3E3A; min-height: 45px\">{{b.desc}}<\u002Fp>\n<svg class=\"pie\" sc-camel-view-box=\"0 0 200 200\" role=\"img\" aria-label=\"{{b.aria}}\">\n<circle class=\"slice\" cx=\"100\" cy=\"100\" r=\"50\" style=\"stroke: {{b.s1.color}}; stroke-dasharray: {{b.s1.dash}}; stroke-dashoffset: {{b.s1.off}}\"><\u002Fcircle>\n<circle class=\"slice\" cx=\"100\" cy=\"100\" r=\"50\" style=\"stroke: {{b.s2.color}}; stroke-dasharray: {{b.s2.dash}}; stroke-dashoffset: {{b.s2.off}}\"><\u002Fcircle>\n<circle class=\"slice\" cx=\"100\" cy=\"100\" r=\"50\" style=\"stroke: {{b.s3.color}}; stroke-dasharray: {{b.s3.dash}}; stroke-dashoffset: {{b.s3.off}}\"><\u002Fcircle>\n<circle class=\"slice\" cx=\"100\" cy=\"100\" r=\"50\" style=\"stroke: {{b.s4.color}}; stroke-dasharray: {{b.s4.dash}}; stroke-dashoffset: {{b.s4.off}}\"><\u002Fcircle>\n<circle class=\"wipe {{b.wipe}}\" cx=\"100\" cy=\"100\" r=\"50\" style=\"stroke: {{b.bg}}\"><\u002Fcircle>\n<\u002Fsvg>\n<div style=\"display: flex; flex-direction: column; gap: 10px; font-variant-numeric: tabular-nums\">\n<sc-for list=\"{{b.legend}}\" as=\"l\" hint-placeholder-count=\"4\">\n<div style=\"display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 42px 70px; align-items: center; gap: 10px; font-size: 15px\">\n<span style=\"width: 12px; height: 12px; border-radius: 50%; background: {{l.color}}\"><\u002Fspan>\n<span>{{l.label}}<\u002Fspan>\n<span style=\"font-weight: 600; text-align: right\">{{l.amount}}<\u002Fspan>\n<span style=\"color: #4A4945; text-align: right\">{{l.share}}<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 600; text-align: right; color: {{l.deltaColor}}\">{{l.delta}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(0,0,0,.12); display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{b.goals}}\" as=\"g\" hint-placeholder-count=\"2\">\n<div style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.4\">\n<sc-if value=\"{{g.ok}}\" hint-placeholder-val=\"{{ true }}\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1A4DB0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 1px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{g.short}}\" hint-placeholder-val=\"{{ false }}\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A3400A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7.5v5.5M12 16.5v.01\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n<span><strong style=\"font-weight: 600\">{{g.name}}<\u002Fstrong> <span style=\"color: #4A4945\">{{g.status}}<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n\n<div class=\"s12 reveal r5\" style=\"padding: 44px 8px 8px\">\n<h2 class=\"serif\" style=\"margin: 0; font-size: 48px; line-height: 1; letter-spacing: -0.01em\">What we suggest<\u002Fh2>\n<\u002Fdiv>\n\n<section class=\"t s3 reveal r5\" style=\"background: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 250px\">\n<span style=\"font-size: 15px; font-weight: 600\">Japan trip, each month<\u002Fspan>\n<div><div class=\"num\" style=\"font-size: 76px\">$571<\u002Fdiv><p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.45; color: #3F3E3A\">Up from $300. Gets you to $4,000 by June 1.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n<section class=\"t s3 reveal r5\" style=\"background: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 250px\">\n<span style=\"font-size: 15px; font-weight: 600\">Moving deposit, each month<\u002Fspan>\n<div><div class=\"num\" style=\"font-size: 76px\">$600<\u002Fdiv><p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.45; color: #3F3E3A\">A new fund. Reaches the full $6,000 by September 1.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n<section class=\"t s3 reveal r6\" style=\"background: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 250px\">\n<span style=\"font-size: 15px; font-weight: 600\">Less on wants, each month<\u002Fspan>\n<div><div class=\"num\" style=\"font-size: 76px\">$598<\u002Fdiv><p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.45; color: #3F3E3A\">Mostly dining out and shopping. Rideshares and yoga stay as they are.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n<section class=\"t s3 reveal r6\" style=\"background: #000000; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 250px\">\n<span style=\"font-size: 15px; font-weight: 600; color: #BDBCB7\">After June<\u002Fspan>\n<p class=\"serif\" style=\"margin: 0; font-size: 30px; line-height: 1.12\">Move the $571 to your credit card. At 22% interest, clearing the $2,400 balance saves more than most savings accounts earn.<\u002Fp>\n<\u002Fsection>\n\n<div class=\"s12 reveal r7\" style=\"padding: 44px 8px 8px\">\n<h2 class=\"serif\" style=\"margin: 0; font-size: 48px; line-height: 1; letter-spacing: -0.01em\">What changes, line by line<\u002Fh2>\n<p style=\"margin: 12px 0 0; font-size: 16px; line-height: 1.5; color: #4A4945\">Grey bars show what you spend today. Hover over or tab to a highlighted amount to see why it changed.<\u002Fp>\n<\u002Fdiv>\n\n<section class=\"t s12 reveal r7\" style=\"background: #FFFFFF; padding-top: 12px; overflow-x: auto\">\n<div role=\"table\" aria-label=\"Monthly amounts in each budget\" style=\"min-width: 700px; font-variant-numeric: tabular-nums\">\n<div role=\"row\" style=\"display: grid; grid-template-columns: minmax(200px, 1.4fr) repeat(3, minmax(160px, 1fr)); gap: 20px; padding: 16px 0 12px; border-bottom: 2px solid #000000; font-size: 14px; font-weight: 600\">\n<span role=\"columnheader\">Item<\u002Fspan>\n<span role=\"columnheader\" style=\"text-align: right\">As it stands<\u002Fspan>\n<span role=\"columnheader\" style=\"text-align: right\">50/30/20<\u002Fspan>\n<span role=\"columnheader\" style=\"text-align: right\">Goals first<\u002Fspan>\n<\u002Fdiv>\n\n<div role=\"row\" style=\"display: grid; grid-template-columns: minmax(200px, 1.4fr) repeat(3, minmax(160px, 1fr)); gap: 20px; align-items: center; padding: 18px 0; border-bottom: 1px solid #E6E5E1\">\n<span role=\"rowheader\" style=\"display: flex; gap: 12px; align-items: flex-start\">\n<svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#000000\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 3px\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>\n<span><span style=\"display: block; font-size: 17px; font-weight: 600\">Essentials<\u002Fspan><span style=\"display: block; font-size: 14px; line-height: 1.45; color: #4A4945\">Rent, utilities, groceries and minimum debt payments. We never change these.<\u002Fspan><\u002Fspan>\n<\u002Fspan>\n<span role=\"cell\" style=\"text-align: right; font-size: 17px; padding-right: 12px\">$2,450<\u002Fspan>\n<span role=\"cell\" style=\"text-align: right; font-size: 17px; padding-right: 12px\">$2,450<\u002Fspan>\n<span role=\"cell\" style=\"text-align: right; font-size: 17px; padding-right: 12px\">$2,450<\u002Fspan>\n<\u002Fdiv>\n\n<sc-for list=\"{{groups}}\" as=\"grp\" hint-placeholder-count=\"3\">\n<div role=\"row\" style=\"display: flex; align-items: center; gap: 10px; padding: 24px 0 6px; font-size: 14px; font-weight: 600; color: #4A4945\">\n<span style=\"width: 12px; height: 12px; border-radius: 50%; background: {{grp.color}}\"><\u002Fspan><span role=\"rowheader\">{{grp.name}}<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{grp.rows}}\" as=\"row\" hint-placeholder-count=\"4\">\n<div role=\"row\" style=\"display: grid; grid-template-columns: minmax(200px, 1.4fr) repeat(3, minmax(160px, 1fr)); gap: 20px; align-items: center; padding: 8px 0 12px; border-bottom: 1px solid #E6E5E1\">\n<span role=\"rowheader\" style=\"font-size: 17px\">{{row.name}}<\u002Fspan>\n<sc-for list=\"{{row.cells}}\" as=\"c\" hint-placeholder-count=\"3\">\n<span role=\"cell\" style=\"display: flex; flex-direction: column; align-items: flex-end; font-size: 17px\">\n<sc-if value=\"{{c.changed}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" class=\"chg {{c.dir}}\" aria-describedby=\"{{c.tipId}}\">\n<span class=\"amt\">{{c.amt}}<\u002Fspan><span class=\"delta\">{{c.delta}}<\u002Fspan>\n<span class=\"tip {{c.end}}\" role=\"tooltip\" id=\"{{c.tipId}}\">{{c.tip}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{c.same}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"padding: 8px 12px\">{{c.amt}}<\u002Fspan><\u002Fsc-if>\n<span class=\"track\" aria-hidden=\"true\"><span class=\"g\" style=\"width: {{c.ghostW}}\"><\u002Fspan><span class=\"f\" style=\"width: {{c.barW}}; background: {{grp.color}}\"><\u002Fspan><\u002Fspan>\n<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<p class=\"s12 reveal r7\" style=\"margin: 20px 8px 0; max-width: 72ch; font-size: 14px; line-height: 1.55; color: #55544F\">Based on what you’ve told us, with amounts converted to monthly figures. This is general guidance to help you plan, not personalised financial advice.<\u002Fp>\n\n<\u002Fmain>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3000}}\">\nvar EXAMPLE = \"I take home about $5,000 a month after tax. Rent is $1,650 and utilities are around $110, and I spend about $90 a week on groceries. I have a student loan with a $210 minimum payment, and a credit card with $2,400 on it at 22% where I pay the $90 minimum. Most months I spend around $680 eating out, $420 on shopping, $240 on concerts and events, $190 on rideshares, $120 on a yoga membership and $48 on streaming. I’m putting $300 a month towards a $4,000 trip to Japan next June, and I’d like to save $6,000 for a moving deposit by next September. I put $250 a month into my retirement account and have about $5,000 in savings.\";\nvar C = 314.16;\nvar INCOME = 5000;\nvar BAR_MAX = 700;\nvar COL = { need: '#000000', want: '#FF7A1A', save: '#2D6CDF', none: '#B9B8B2' };\n\nfunction money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }\n\nfunction squiggle() {\n  var pts = [];\n  for (var i = 0; i <= 240; i++) {\n    var t = i / 240 * Math.PI * 2;\n    var r = 52 + 6 * Math.sin(t * 14);\n    pts.push((70 + r * Math.cos(t)).toFixed(2) + ' ' + (70 + r * Math.sin(t)).toFixed(2));\n  }\n  return 'M' + pts.join(' L') + 'Z';\n}\nvar SQUIGGLE = squiggle();\n\nfunction pie(vals) {\n  var keys = ['need', 'want', 'save', 'none'];\n  var pos = 0;\n  var out = {};\n  keys.forEach(function (k, i) {\n    var len = vals[i] / INCOME * C;\n    out['s' + (i + 1)] = { color: COL[k], dash: len.toFixed(2) + ' ' + C, off: (-pos).toFixed(2) };\n    pos += len;\n  });\n  return out;\n}\n\nfunction legend(vals, base) {\n  var labels = ['Needs', 'Wants', 'Savings', 'Not assigned'];\n  var keys = ['need', 'want', 'save', 'none'];\n  return vals.map(function (v, i) {\n    var share = Math.round(v / INCOME * 100);\n    var delta = '';\n    var color = '#4A4945';\n    if (base) {\n      var d = share - Math.round(base[i] / INCOME * 100);\n      if (d === 0) { delta = 'Same'; }\n      else { delta = (d > 0 ? '+' : '−') + Math.abs(d) + ' pts'; color = d > 0 && i === 2 ? '#1A4DB0' : (d < 0 && i === 1 ? '#A3400A' : '#45443F'); }\n    }\n    return { label: labels[i], color: COL[keys[i]], amount: money(v), share: share + '%', delta: delta, deltaColor: color };\n  });\n}\n\nvar CUR = [2450, 1698, 550, 302];\nvar A = [2450, 1500, 1050, 0];\nvar B = [2450, 1100, 1450, 0];\n\nvar TIP_JAPAN = 'At $300 a month you’d have $2,100 by June 1, which is $1,900 short. $571 a month for the next seven months gets you to $4,000 on time.';\nvar TIP_UNASSIGNED = 'This money wasn’t going anywhere in particular. Giving it a job means it now goes towards your goals.';\n\nfunction pct(n) { return Math.min(100, n / BAR_MAX * 100).toFixed(1) + '%'; }\n\nfunction row(name, cur, a, b, kind) {\n  var cells = [[cur], a, b].map(function (cv, idx) {\n    var amt = cv[0];\n    var changed = idx > 0 && amt !== cur;\n    var d = amt - cur;\n    var dir = kind === 'none' ? 'is-moved' : (d < 0 ? 'is-cut' : 'is-up');\n    return {\n      changed: changed, same: !changed,\n      amt: money(amt),\n      delta: cv[2] || ((d > 0 ? '+' : '−') + money(Math.abs(d))),\n      dir: dir, tip: cv[1] || '',\n      tipId: 'tip-' + name.replace(/\\W+/g, '-').toLowerCase() + '-' + idx,\n      end: idx === 2 ? 'end' : '',\n      barW: pct(amt),\n      ghostW: idx > 0 ? pct(cur) : '0%'\n    };\n  });\n  return { name: name, cells: cells };\n}\n\nvar GROUPS = [\n  { name: 'Wants', color: COL.want, rows: [\n    row('Dining out', 680,\n      [540, 'Dining out is your largest flexible expense. Trimming $140 brings wants down to 30% of take-home pay and still leaves room for a couple of meals out each week.'],\n      [400, 'To fund both goals, wants need to fit within $1,100. Dining out takes the biggest share of that cut, and $400 still covers a meal out most weekends.']),\n    row('Shopping', 420,\n      [362, 'A $58 trim closes the rest of the gap to the 30% ceiling. It’s small enough that it shouldn’t feel like a big change.'],\n      [250, 'Bringing shopping to $250 covers everyday needs with some room for the occasional treat.']),\n    row('Concerts and events', 240, [240],\n      [140, 'Keeps one or two shows a month rather than cutting events out altogether.']),\n    row('Rideshares', 190, [190], [190]),\n    row('Yoga membership', 120, [120], [120]),\n    row('Streaming', 48, [48],\n      [0, 'Streaming is all or nothing, so it’s paused rather than trimmed. You could bring it back in September, once the moving deposit is fully saved.', 'Paused'])\n  ]},\n  { name: 'Savings', color: COL.save, rows: [\n    row('Japan trip', 300, [571, TIP_JAPAN], [571, TIP_JAPAN]),\n    row('Moving deposit', 0,\n      [229, 'This is what’s left once the Japan trip is funded. It’s a solid start, but you’d reach about $2,300 by September 1, so the deposit would still fall short.'],\n      [600, '$600 a month for the ten months before September 1 gets you to the full $6,000 on time.']),\n    row('Retirement', 250, [250], [250]),\n    row('Emergency fund', 0, [0],\n      [29, 'The $29 left over goes to your emergency fund. Your $5,000 in savings covers about two months of essentials today, and three months is a healthy target.'])\n  ]},\n  { name: 'Not assigned', color: COL.none, rows: [\n    row('Left over each month', 302, [0, TIP_UNASSIGNED], [0, TIP_UNASSIGNED], 'none')\n  ]}\n];\n\nfunction budget(name, desc, vals, base, wipe, rv, bg, recommended, goals) {\n  var p = pie(vals);\n  return {\n    name: name, desc: desc, wipe: wipe, rv: rv, bg: bg, recommended: recommended,\n    s1: p.s1, s2: p.s2, s3: p.s3, s4: p.s4,\n    aria: name + ' budget: needs ' + money(vals[0]) + ', wants ' + money(vals[1]) + ', savings ' + money(vals[2]) + ', not assigned ' + money(vals[3]) + ' a month.',\n    legend: legend(vals, base),\n    goals: goals.map(function (g) { return { name: g[0], status: g[1], ok: g[2], short: !g[2] }; })\n  };\n}\n\nvar BUDGETS = [\n  budget('As it stands', 'Your budget as you described it.', CUR, null, 'w1', 'r3', '#F4F3F0', false, [\n    ['Japan trip', '$1,900 short by June 1', false],\n    ['Moving deposit', 'Not started, $6,000 to go by September 1', false]\n  ]),\n  budget('50/30/20', 'Half to needs, up to 30% on wants and at least 20% saved.', A, CUR, 'w2', 'r4', '#FFFFFF', false, [\n    ['Japan trip', 'On track for June 1', true],\n    ['Moving deposit', 'About $3,700 short by September 1', false]\n  ]),\n  budget('Goals first', 'Fund both goals on time, then split the rest 5:3 between needs and wants.', B, CUR, 'w3', 'r5', '#CDEBF7', true, [\n    ['Japan trip', 'On track for June 1', true],\n    ['Moving deposit', 'On track for September 1', true]\n  ])\n];\n\nclass Component extends DCLogic {\n  componentWillUnmount() { clearTimeout(this._timer); }\n  renderVals() {\n    var self = this;\n    var st = this.state || {};\n    var phase = st.phase || 'input';\n    var text = st.text || '';\n    var trimmed = text.trim();\n    return {\n      text: text,\n      showHint: !!st.hint && trimmed.length === 0,\n      snippet: trimmed,\n      squiggle: SQUIGGLE,\n      introClass: phase === 'input' ? 'intro' : 'intro is-gone',\n      cardClass: phase === 'input' ? 'card is-open' : 'card is-closed',\n      isWorking: phase === 'working',\n      showResults: phase === 'results',\n      onText: function (e) { var v = e && e.target ? e.target.value : ''; self.setState({ text: v }); },\n      useExample: function () { self.setState({ text: EXAMPLE, hint: false }); },\n      submit: function (e) {\n        if (e && e.preventDefault) e.preventDefault();\n        var cur = ((self.state && self.state.text) || '').trim();\n        if (!cur) { var el = null; try { el = document.getElementById('situation'); } catch (err) {} cur = el && el.value ? el.value.trim() : ''; if (cur) { self.setState({ text: cur }); } }\n        if (!cur) { self.setState({ hint: true }); return; }\n        var reduce = false;\n        try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (err) {}\n        self.setState({ phase: 'working' });\n        clearTimeout(self._timer);\n        self._timer = setTimeout(function () { self.setState({ phase: 'results' }); }, reduce ? 100 : 1700);\n      },\n      edit: function () { clearTimeout(self._timer); self.setState({ phase: 'input' }); },\n      budgets: BUDGETS,\n      groups: GROUPS\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
